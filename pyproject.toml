[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sequel"
version = "0.1.0"
description = "SQL formatting, sanitization and structural summaries from a shared C engine"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "third_party/UTF8PROC_LICENSE.md"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["python"]
include = ["sequel*"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[dependency-groups]
dev = ["ruff>=0.14", "ty>=0.0.91", "clang-format>=21"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E501"]

[tool.ty.src]
include = ["python"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" }, { file = "setup.py" },
    { file = "python/sequel/*.py" }, { file = "python/sequel/*.pyi" },
    { file = "python/sequel/*.c" }, { file = "python/sequel/py.typed" }, { file = "src/**" },
    { file = "include/**" }, { file = "third_party/**" },
]
