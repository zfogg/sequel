name: Release
on:
  push:
    tags: ['v*.*.*']
    branches: [codex/release-preflight]
  workflow_dispatch:
    inputs:
      tag:
        description: Version to validate without publishing
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: false
      - id: version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          tag="$REQUESTED_TAG"
          if [[ -z "$tag" ]]; then
            if [[ '${{ github.ref_type }}' == tag ]]; then tag='${{ github.ref_name }}';
            else tag="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"; fi
          fi
          python scripts/package_release.py validate --tag "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  native:
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: x64, target: x86_64-unknown-linux-gnu, wheel_arch: x86_64}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, target: aarch64-unknown-linux-gnu, wheel_arch: aarch64}
          - {runner: macos-26-intel, os: macos, arch: x64, target: x86_64-apple-darwin}
          - {runner: macos-26, os: macos, arch: arm64, target: aarch64-apple-darwin}
          - {runner: windows-2025, os: windows, arch: x64, target: x86_64-pc-windows-msvc, msvc: amd64}
          - {runner: windows-11-arm, os: windows, arch: arm64, target: aarch64-pc-windows-msvc, msvc: amd64_arm64}
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          # x64 reference-test dependencies can launch native Windows ARM EXEs.
          architecture: ${{ matrix.os == 'windows' && 'x64' || matrix.arch }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows'
        with:
          arch: ${{ matrix.msvc }}
      - if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build patchelf
      - if: matrix.os == 'macos'
        run: brew install ninja
      - run: uv pip install --system -r tests/requirements-format.txt
      - name: Test bundled Rust engine and C ABI
        run: cargo test --locked --features abi-check --target ${{ matrix.target }}
      - name: Build and consume release archives
        run: python scripts/release_native.py --tag ${{ needs.validate.outputs.tag }} --os ${{ matrix.os }} --arch ${{ matrix.arch }} --target ${{ matrix.target }}
      - name: Select native ARM64 Python for its wheel
        if: matrix.os == 'windows' && matrix.arch == 'arm64'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64
      - name: Build native Python wheel
        run: python scripts/build_release_wheel.py
      - name: Repair Linux wheel platform metadata
        if: matrix.os == 'linux'
        shell: bash
        run: uv tool run --from auditwheel auditwheel repair dist/raw/*.whl --plat manylinux_2_39_${{ matrix.wheel_arch }} --wheel-dir dist/wheels
      - name: Select macOS/Windows wheel
        if: matrix.os != 'linux'
        shell: bash
        run: mkdir -p dist/wheels && cp dist/raw/*.whl dist/wheels/
      - name: Test installed wheel, without source imports
        shell: bash
        run: python scripts/test_release_wheel.py dist/wheels/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/release/*.zip
            dist/wheels/*.whl
          if-no-files-found: error
  sources:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: uv sync --extra test --locked
      - run: uv run python scripts/style.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
      - run: go test ./...
      - run: go vet ./...
      - run: uv run --extra test pytest -q
      - run: uv run --extra test python -m unittest discover -s tests -p test_release.py
      - run: cargo package --locked
      - run: uv build --sdist --out-dir dist/release
      - run: python scripts/package_release.py bindings --tag ${{ needs.validate.outputs.tag }} --output dist/release
      - run: cp target/package/sequel-*.crate dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: release-sources
          path: dist/release/*
          if-no-files-found: error
  publish:
    needs: [validate, native, sources]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Checksum and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          python scripts/package_release.py checksums --tag "$RELEASE_TAG" --output dist/release
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file docs/releases.md
          fi
          gh release upload "$RELEASE_TAG" dist/release/* --clobber
