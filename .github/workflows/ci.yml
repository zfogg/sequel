name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shared: [OFF, ON]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install -r tests/requirements-format.txt
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=${{ matrix.shared }}
      - run: cmake --build build --config Debug --parallel 4
      - run: ctest --test-dir build -C Debug --output-on-failure --parallel 4
      - run: cmake --install build --config Debug --prefix install
      - run: go test ./...
      - run: go vet ./...
      - run: uv run --extra test pytest -q
      - run: uv build
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./go -run '^$' -fuzz FuzzSanitizeDoesNotRetainQuotedPayload -fuzztime 10s
      - run: go test ./go -run '^$' -fuzz FuzzFormatSQL -fuzztime 10s
      - run: go test ./go -run '^$' -fuzz FuzzSummary -fuzztime 10s
