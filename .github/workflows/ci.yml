name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shared: [OFF, ON]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: ./.github/actions/setup-cxx2d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo test --locked --features abi-check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: uv pip install --system -r tests/requirements-format.txt
      - run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER="$SEQUEL_CC" -DCMAKE_CXX_COMPILER="$SEQUEL_CXX" -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=${{ matrix.shared }}
        shell: bash
      - run: cmake --build build --config Debug --parallel 4
      - run: ctest --test-dir build -C Debug --output-on-failure --parallel 4
      - run: cmake --install build --config Debug --prefix install
      - run: go test ./...
      - run: go vet ./...
      - run: uv run --extra test pytest -q
      - run: uv run --extra test python scripts/style.py
      - run: uv build
      - run: cmake -S tests/cmake-consumer -B build-consumer -G Ninja -DCMAKE_C_COMPILER="$SEQUEL_CC" -DCMAKE_CXX_COMPILER="$SEQUEL_CXX" -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"
        shell: bash
      - run: cmake --build build-consumer --config Debug
      - run: ctest --test-dir build-consumer -C Debug --output-on-failure
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./go -run '^$' -fuzz FuzzSanitizeDoesNotRetainQuotedPayload -fuzztime 100000x -parallel 2
      - run: go test ./go -run '^$' -fuzz FuzzFormatSQL -fuzztime 100000x -parallel 2
      - run: go test ./go -run '^$' -fuzz FuzzSummary -fuzztime 100000x -parallel 2
      - run: go test ./go -run '^$' -fuzz FuzzHighlightSQL -fuzztime 10000x -parallel 2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-regressions
          path: go/testdata/fuzz


  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-cxx2d
      - run: cmake -S . -B build -DCMAKE_C_COMPILER="$SEQUEL_CC" -DCMAKE_CXX_COMPILER="$SEQUEL_CXX" -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DSEQUEL_BUILD_CLI=OFF
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build -R 'sequel-(sql|sql_sanitize|sql_clickhouse|migrated|api|selective|highlight-api|diagnostics-api)$' --output-on-failure
